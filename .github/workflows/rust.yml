name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Generate workspace lockfile
        run: cargo generate-lockfile
      - name: Validate workspace metadata
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace
      - name: Check workspace
        run: cargo check --workspace
      - name: Run headless lifecycle smoke example
        run: cargo run -p zyne-runtime --example headless_smoke
      - name: Upload generated Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: zyne-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
