[workspace]
resolver = "2"
members = [
    "crates/zyne-core",
    "crates/zyne-math",
    "crates/zyne-platform",
    "crates/zyne-graphics",
    "crates/zyne-runtime",
    "crates/zyne-scene",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["ZYNE Contributors"]
repository = "https://github.com/vivobook244/zyne-engine"

[workspace.dependencies]
bevy_ecs = { version = "=0.16.1", default-features = false, features = ["std"] }
ron = "=0.12.2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
